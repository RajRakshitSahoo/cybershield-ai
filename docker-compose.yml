version: "3.9"

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build: ./backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - USE_MOCK_DB=false
      - MONGO_URI=mongodb://mongo:27017
      - MONGO_DB_NAME=cybershield
      - SECRET_KEY=${SECRET_KEY:-change_this_to_a_long_random_string}
      - FRONTEND_ORIGIN=http://localhost:5173
      - VIRUSTOTAL_API_KEY=${VIRUSTOTAL_API_KEY:-}
      - GOOGLE_SAFE_BROWSING_API_KEY=${GOOGLE_SAFE_BROWSING_API_KEY:-}
      - ABUSEIPDB_API_KEY=${ABUSEIPDB_API_KEY:-}
    depends_on:
      - mongo

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  mongo_data:
